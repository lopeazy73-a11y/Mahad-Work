backend:
  name: git-gateway
  branch: main # Agar aapki repository ki default branch 'master' hai toh yahan master likhein

media_folder: "public/images" # Yeh woh folder hai jahan aapki upload ki gayi tasveerein save hongi
public_folder: "/images"

collections:
  - name: "pages"
  - label: "Pages"
  - files:
      - file: "index.html" # Ya aapki jo main HTML file ho
        label: "Home Page"
        name: "home"
        fields:
          - {label: "Title", name: "title", widget: "string"}
